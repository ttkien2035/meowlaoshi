[package]
name = "my-translator"
version = "1.1.0"
description = "MeowLaoshi (猫老师): real-time lecture translation (Chinese → Vietnamese) with notes"
authors = ["ttkien2035", "phucnt (original author)"]
edition = "2021"

[lib]
name = "my_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enabled only for dev builds (via scripts/tauri-with-env.mjs) to expose the WebView
# inspector. Release builds (npm run build / tauri build) never enable this.
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = "0.4"
cpal = "0.15"
reqwest = { version = "0.12", features = ["rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
http = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
rubato = "0.16"
# sherpa-onnx: Piper TTS, Silero VAD, GTCRN denoiser, SenseVoice ASR.
# Static on the release platforms (no dylib bundling). Linux is a dev/CI
# target only: its prebuilt static libs use the old libstdc++ string ABI and
# crash inside onnxruntime on Ubuntu 24.04, so link the shared libs there.
sherpa-onnx = { version = "1.13.3", default-features = false }
tauri-plugin-dialog = "2"
# Model archive extraction (.tar.bz2) for downloaded Piper voices / SenseVoice.
tar = "0.4"
bzip2 = "0.4"
# Local translation LLM (Qwen2.5 GGUF) via llama.cpp, statically linked.
# No default features: `common` (llama.cpp's common lib) isn't needed.
llama-cpp-2 = { version = "0.1.157", default-features = false }

[target.'cfg(not(target_os = "linux"))'.dependencies]
sherpa-onnx = { version = "1.13.3", default-features = false, features = ["static"] }

[target.'cfg(target_os = "linux")'.dependencies]
sherpa-onnx = { version = "1.13.3", default-features = false, features = ["shared"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# Apple Silicon: run the LLM on the GPU through Metal.
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["metal"] }

# macOS: ScreenCaptureKit for system audio
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
screencapturekit = "1.5"
# Apple Voice-Processing I/O unit for the microphone (system AEC/NS/AGC).
# Same version + features as cpal's own dependency, so no second copy is built.
coreaudio-rs = { version = "0.11", default-features = false, features = ["audio_unit", "core_audio"] }

# Windows: WASAPI for system audio (legacy loopback only)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_Foundation",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2"

[dev-dependencies]
# Test-only: SIGABRT → Rust backtrace for FFI crash diagnosis.
libc = "0.2"
